.plan-labels{fill:#909584;font-family:Segoe UI,sans-serif;font-size:9px;letter-spacing:1.7px}
.seat{fill:#a8c6b5;stroke:#6c9582;stroke-width:.6}
.plan-senate .plan-desk-surface{stroke-width:23}</style>

