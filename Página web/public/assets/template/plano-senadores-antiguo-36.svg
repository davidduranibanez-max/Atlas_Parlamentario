<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" class="hemicycle-plan plan-senate plan-historic" role="img" aria-labelledby="historic-title" focusable="false">
<title id="historic-title">Antiguo Congreso Nacional · Senadores · 36 escaños</title>
<desc>Distribución de puntos medida de la referencia electoral de 2014, conservando sus proporciones y el estilo del atlas. Sin medidas arquitectónicas ni asignaciones personales de asiento.</desc>
